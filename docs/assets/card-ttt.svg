<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240">
<defs><radialGradient id="f" cx="85%" cy="20%" r="70%"><stop offset="0" stop-color="#4f5bff" stop-opacity=".18"/><stop offset="1" stop-color="#4f5bff" stop-opacity="0"/></radialGradient>
<clipPath id="r"><rect width="580" height="240" rx="24"/></clipPath></defs>
<style>
.p{animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.d{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 4s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:100}25%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
.fly{animation:fly 1.6s cubic-bezier(.2,.7,.4,1) infinite}
@keyframes fly{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
.shot{animation:shot .4s linear infinite}
@keyframes shot{0%{transform:translateX(0);opacity:1}100%{transform:translateX(36px);opacity:0}}
.btn{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.p,.d,.fly,.shot,.btn{animation:none;stroke-dashoffset:0}}
</style>
