name: Tic-tac-toe

on:
  issues:
    types: [opened]

concurrency:
  group: ttt
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const play = require('./game/ttt.js');
            await play({ github, context });
      - name: Commit the board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/ttt.json
          git diff --cached --quiet || (git commit -m "Tic-tac-toe move" && git push)
