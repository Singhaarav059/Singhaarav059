<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Play · Aarav Singh</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;800&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; font-family: Urbanist, system-ui, sans-serif; color: #15172a;
    background: radial-gradient(60% 50% at 15% 10%, #dfe4ff, transparent 70%), radial-gradient(50% 45% at 90% 25%, #ffe1e7, transparent 70%), #f4f6fb; }
  main { width: min(1200px, 100%); }
  h1 { font-weight: 800; font-size: 32px; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .grid a { display: block; border-radius: 24px; transition: transform .2s ease; }
  .grid a:hover { transform: translateY(-3px); }
  img { width: 100%; display: block; }
  p { color: #6b7088; } p a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Play</h1>
  <div class="grid">
    <a href="destroy/"><img src="assets/card-destroy.svg" alt="Destroy this profile" /></a>
    <a href="tictactoe/"><img src="assets/card-ttt.svg" alt="Tic-tac-toe" /></a>
  </div>
  <p><a href="https://github.com/Singhaarav059">← Back to GitHub</a></p>
</main>
</body>
</html>
